<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhaka Club — Premium Member App Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --card: #161616;
    --card2: #1c1c1c;
    --border: rgba(255,255,255,0.07);
    --gold: #C9A84C;
    --gold2: #E8C96A;
    --gold-dim: rgba(201,168,76,0.15);
    --white: #F5F0E8;
    --grey: rgba(245,240,232,0.45);
    --grey2: rgba(245,240,232,0.2);
    --red: #E05C5C;
    --green: #5BCE8A;
    --blue: #5B9BCE;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'DM Sans', sans-serif;
    --font-serif: 'Playfair Display', serif;
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 20px 60px rgba(0,0,0,0.5);
    --gold-glow: 0 0 30px rgba(201,168,76,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080808;
    color: var(--white);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- LAYOUT ---- */
  .prototype-shell {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 60px;
    gap: 60px;
  }

  .section-label {
    text-align: center;
    margin-bottom: 0;
  }
  .section-label h2 {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 400;
    margin-bottom: 6px;
  }
  .section-label p {
    font-size: 11px;
    color: var(--grey);
    letter-spacing: 0.1em;
  }

  /* ---- PHONE FRAME ---- */
  .phone {
    width: 375px;
    min-height: 812px;
    background: var(--dark);
    border-radius: 44px;
    border: 1.5px solid rgba(201,168,76,0.25);
    box-shadow: 0 40px 120px rgba(0,0,0,0.8), var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .phone-notch {
    width: 126px;
    height: 34px;
    background: #000;
    border-radius: 0 0 24px 24px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
    z-index: 10;
  }
  .phone-notch-dot { width: 10px; height: 10px; background: #1a1a1a; border-radius: 50%; }
  .phone-notch-pill { width: 70px; height: 8px; background: #1a1a1a; border-radius: 8px; }
  .phone-status {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 24px 0;
    font-size: 11px; font-weight: 500; color: var(--white);
  }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .status-icons svg { width: 14px; height: 14px; fill: var(--white); }

  /* ---- SCREENS ---- */
  .screen { display: none; width: 100%; min-height: 778px; position: relative; overflow: hidden; }
  .screen.active { display: block; }

  /* ---- SCREEN ROW (2 phones side by side) ---- */
  .screen-row {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }
  .screen-block { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .screen-tag {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: var(--font-body);
  }

  /* =================== SPLASH =================== */
  #splash {
    background: radial-gradient(ellipse at 50% 40%, #1a1410 0%, #0a0a0a 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px 30px;
    cursor: pointer;
  }
  .splash-logo-ring {
    width: 110px; height: 110px;
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    animation: rotatering 8s linear infinite;
  }
  .splash-logo-ring::before {
    content: '';
    position: absolute;
    width: 130px; height: 130px;
    border: 1px dashed rgba(201,168,76,0.15);
    border-radius: 50%;
    animation: rotatering 12s linear infinite reverse;
  }
  @keyframes rotatering { to { transform: rotate(360deg); } }
  .splash-logo-inner {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #1e1a12, #2a2215);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(201,168,76,0.3);
    box-shadow: 0 0 20px rgba(201,168,76,0.15);
  }
  .splash-logo-inner span {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 300;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .splash-title { text-align: center; }
  .splash-title h1 {
    font-family: var(--font-display);
    font-size: 36px; font-weight: 300;
    color: var(--white);
    letter-spacing: 0.15em;
  }
  .splash-title p {
    font-size: 10px; letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 300;
  }
  .splash-divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .splash-tagline {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 14px;
    color: var(--grey);
    text-align: center;
    line-height: 1.6;
  }
  .splash-enter {
    margin-top: 20px;
    padding: 14px 40px;
    border: 1px solid rgba(201,168,76,0.5);
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(201,168,76,0.05));
    color: var(--gold);
    font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 400;
    transition: all 0.3s;
  }
  .splash-enter:hover { background: rgba(201,168,76,0.2); }
  .splash-founding { font-size: 10px; color: var(--grey2); letter-spacing: 0.1em; }

  /* =================== LOGIN =================== */
  #login { background: var(--dark); padding: 0; }
  .login-header {
    height: 220px;
    background: linear-gradient(180deg, #0e0c08 0%, #161210 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 30px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .login-header::before {
    content: '';
    position: absolute;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
    top: 20px;
  }
  .login-logo-sm {
    font-family: var(--font-display);
    font-size: 42px; font-weight: 300;
    color: var(--gold); letter-spacing: 6px;
    position: relative; z-index: 1;
  }
  .login-subtitle {
    font-size: 10px; letter-spacing: 0.3em;
    color: var(--grey); text-transform: uppercase;
    margin-top: 6px;
    position: relative; z-index: 1;
  }
  .login-body { padding: 36px 28px; }
  .login-welcome {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 300;
    color: var(--white);
    margin-bottom: 6px;
  }
  .login-desc { font-size: 12px; color: var(--grey); line-height: 1.6; margin-bottom: 32px; }
  .input-group { margin-bottom: 18px; }
  .input-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; display: block; }
  .input-field {
    width: 100%; padding: 16px 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--white); font-family: var(--font-body);
    font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .input-field::placeholder { color: var(--grey2); }
  .input-field:focus { border-color: rgba(201,168,76,0.4); }
  .input-row { display: flex; gap: 10px; }
  .input-prefix {
    padding: 16px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px; color: var(--grey); white-space: nowrap;
    display: flex; align-items: center;
  }
  .btn-primary {
    width: 100%; padding: 18px;
    background: linear-gradient(135deg, #C9A84C, #A8883A);
    border: none; border-radius: var(--radius-sm);
    color: #0a0a0a; font-family: var(--font-body);
    font-size: 13px; font-weight: 500; letter-spacing: 0.1em;
    cursor: pointer; margin-top: 8px;
    box-shadow: 0 8px 24px rgba(201,168,76,0.3);
    transition: all 0.2s;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(201,168,76,0.4); }
  .login-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .login-divider span { font-size: 11px; color: var(--grey2); }
  .login-divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
  .btn-secondary {
    width: 100%; padding: 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--white); font-family: var(--font-body);
    font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: rgba(201,168,76,0.3); color: var(--gold); }

  /* =================== HOME =================== */
  #home { background: var(--dark); overflow-y: auto; padding-bottom: 80px; }
  .home-header {
    padding: 16px 22px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .home-header-left h3 {
    font-family: var(--font-display); font-size: 12px;
    color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase;
    font-weight: 400;
  }
  .home-header-left p {
    font-family: var(--font-display); font-size: 24px;
    color: var(--white); font-weight: 300; margin-top: 2px;
  }
  .notif-btn {
    width: 40px; height: 40px;
    background: var(--card);
    border-radius: 50%; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
  }
  .notif-dot {
    width: 8px; height: 8px;
    background: var(--gold); border-radius: 50%;
    position: absolute; top: 8px; right: 8px;
    border: 1.5px solid var(--dark);
  }

  /* Member card */
  .member-card {
    margin: 18px 22px;
    border-radius: var(--radius);
    padding: 22px;
    background: linear-gradient(135deg, #1a1508 0%, #0e0c07 60%, #1a1508 100%);
    border: 1px solid rgba(201,168,76,0.3);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(201,168,76,0.1);
    position: relative; overflow: hidden;
  }
  .member-card::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 150px; height: 150px;
    background: radial-gradient(circle, rgba(201,168,76,0.08), transparent 70%);
  }
  .member-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .member-avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a2010, #3a3018);
    border: 2px solid rgba(201,168,76,0.4);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 18px; color: var(--gold);
  }
  .member-badge {
    background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.1));
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 20px; padding: 4px 12px;
    font-size: 9px; letter-spacing: 0.2em; color: var(--gold);
    text-transform: uppercase;
  }
  .member-name {
    font-family: var(--font-serif); font-size: 18px;
    color: var(--white); margin-top: 14px; font-weight: 400;
  }
  .member-id { font-size: 10px; color: var(--grey); letter-spacing: 0.15em; margin-top: 4px; }
  .member-card-footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid rgba(201,168,76,0.12);
  }
  .member-stat-label { font-size: 9px; color: var(--grey); text-transform: uppercase; letter-spacing: 0.1em; }
  .member-stat-val { font-size: 14px; color: var(--white); font-weight: 500; margin-top: 2px; }
  .card-chip {
    width: 30px; height: 22px;
    background: linear-gradient(135deg, rgba(201,168,76,0.3), rgba(201,168,76,0.1));
    border-radius: 4px; border: 1px solid rgba(201,168,76,0.3);
  }

  /* Quick actions */
  .section-head {
    padding: 0 22px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-head h4 {
    font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--grey);
  }
  .section-head a { font-size: 10px; color: var(--gold); letter-spacing: 0.1em; }
  .quick-actions {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; padding: 0 22px; margin-bottom: 22px;
  }
  .qa-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; transition: all 0.2s;
  }
  .qa-item:hover { border-color: rgba(201,168,76,0.3); }
  .qa-icon {
    width: 36px; height: 36px;
    background: var(--gold-dim);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .qa-label { font-size: 9px; color: var(--grey); text-align: center; letter-spacing: 0.05em; }

  /* Events carousel */
  .events-scroll {
    display: flex; gap: 12px;
    padding: 0 22px; overflow-x: auto;
    scrollbar-width: none; margin-bottom: 22px;
  }
  .events-scroll::-webkit-scrollbar { display: none; }
  .event-card {
    flex-shrink: 0; width: 200px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden; cursor: pointer;
  }
  .event-img {
    height: 90px;
    background: linear-gradient(135deg, #1a1508, #2a200a);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; position: relative;
  }
  .event-date-badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(201,168,76,0.9); border-radius: 6px;
    padding: 4px 8px; text-align: center;
    font-size: 11px; font-weight: 600; color: #0a0a0a;
    line-height: 1.2;
  }
  .event-info { padding: 12px; }
  .event-title { font-size: 12px; color: var(--white); font-weight: 500; margin-bottom: 4px; }
  .event-meta { font-size: 10px; color: var(--grey); }
  .event-rsvp {
    display: inline-block; margin-top: 8px;
    padding: 5px 14px; border-radius: 20px;
    background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3);
    font-size: 9px; color: var(--gold); letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Announcements */
  .announce-list { padding: 0 22px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .announce-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex; gap: 12px; align-items: flex-start;
    cursor: pointer;
  }
  .announce-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--gold-dim); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .announce-text h5 { font-size: 12px; color: var(--white); font-weight: 500; margin-bottom: 3px; }
  .announce-text p { font-size: 10px; color: var(--grey); line-height: 1.5; }
  .announce-time { font-size: 9px; color: var(--grey2); margin-top: 4px; }

  /* Bottom Nav */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 72px;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 10px 8px;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; padding: 6px 12px;
    border-radius: 10px; transition: all 0.2s;
    flex: 1;
  }
  .nav-item.active .nav-icon { color: var(--gold); }
  .nav-item.active .nav-label { color: var(--gold); }
  .nav-icon { font-size: 20px; color: var(--grey2); }
  .nav-label { font-size: 9px; color: var(--grey2); letter-spacing: 0.05em; }
  .nav-item.active { background: var(--gold-dim); }

  /* =================== NOTIFICATIONS =================== */
  #notifications { background: var(--dark); overflow-y: auto; padding-bottom: 80px; }
  .page-header {
    padding: 16px 22px 20px;
    border-bottom: 1px solid var(--border);
  }
  .page-header h2 {
    font-family: var(--font-display); font-size: 28px;
    font-weight: 300; color: var(--white);
  }
  .page-header p { font-size: 11px; color: var(--grey); margin-top: 4px; }
  .filter-row {
    display: flex; gap: 8px; padding: 16px 22px;
    overflow-x: auto; scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-pill {
    flex-shrink: 0; padding: 7px 16px;
    border-radius: 20px; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
    border: 1px solid var(--border);
    color: var(--grey); background: transparent;
  }
  .filter-pill.active {
    background: var(--gold-dim);
    border-color: rgba(201,168,76,0.4);
    color: var(--gold);
  }
  .notif-list { padding: 0 22px; display: flex; flex-direction: column; gap: 10px; }
  .notif-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    display: flex; gap: 12px;
    position: relative;
  }
  .notif-item.unread { border-left: 3px solid var(--gold); }
  .notif-item.urgent { border-left: 3px solid var(--red); }
  .notif-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .notif-avatar.gold { background: var(--gold-dim); }
  .notif-avatar.red { background: rgba(224,92,92,0.15); }
  .notif-avatar.blue { background: rgba(91,155,206,0.15); }
  .notif-content h5 { font-size: 12px; color: var(--white); font-weight: 500; margin-bottom: 4px; }
  .notif-content p { font-size: 11px; color: var(--grey); line-height: 1.5; }
  .notif-time { font-size: 9px; color: var(--grey2); margin-top: 6px; }
  .unread-dot {
    width: 7px; height: 7px;
    background: var(--gold); border-radius: 50%;
    position: absolute; top: 14px; right: 14px;
  }

  /* =================== MEMBERSHIP CARD =================== */
  #membership { background: var(--dark); overflow-y: auto; padding-bottom: 80px; }
  .card-3d-wrap {
    margin: 24px 22px;
    perspective: 1000px;
  }
  .digital-card {
    width: 100%; border-radius: 22px;
    background: linear-gradient(135deg, #1a1508 0%, #0e0c07 50%, #221d0a 100%);
    border: 1px solid rgba(201,168,76,0.4);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(201,168,76,0.08);
    padding: 28px 24px;
    position: relative; overflow: hidden;
  }
  .digital-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(201,168,76,0.015) 30px, rgba(201,168,76,0.015) 31px);
  }
  .dc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
  .dc-logo { font-family: var(--font-display); font-size: 22px; color: var(--gold); letter-spacing: 4px; font-weight: 300; }
  .dc-logo small { display: block; font-size: 8px; letter-spacing: 0.3em; color: var(--grey); text-transform: uppercase; }
  .dc-type {
    padding: 4px 12px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(201,168,76,0.25), rgba(201,168,76,0.1));
    border: 1px solid rgba(201,168,76,0.4);
    font-size: 9px; letter-spacing: 0.2em; color: var(--gold);
    text-transform: uppercase;
  }
  .dc-member-row { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
  .dc-photo {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #2a2010, #3a2e14);
    border: 2px solid rgba(201,168,76,0.5);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 22px; color: var(--gold);

function bottomNav(active) {
  const items = [
    { id: 'home', icon: '🏠', label: 'Home' },
    { id: 'events', icon: '🎭', label: 'Events' },
    { id: 'membership', icon: '🪪', label: 'Card' },
    { id: 'billing', icon: '💳', label: 'Bills' },
    { id: 'admin', icon: '⚙️', label: 'Admin' }
  ];
  const html = items.map(i => `
    <div class="nav-item ${i.id === active ? 'active' : ''}" onclick="navigateTo('${i.id}')">
      <div class="nav-icon">${i.icon}</div>
      <div class="nav-label">${i.label}</div>
    </div>`).join('');
  return `<div class="bottom-nav">${html}</div>`;
}

function buildPhone(screenId) {
  const phone = document.createElement('div');
  phone.className = 'phone';
  phone.innerHTML = screens[screenId].content;
  return phone;
}

  document.querySelectorAll('.screen-nav-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.screen-nav-btn').forEach(btn => {
    if (btn.textContent.toLowerCase().includes(screens[screenId].label.toLowerCase().split(' ')[0].toLowerCase())) {
      btn.classList.add('active');
    }
  });

  // Find clicked button properly
  event && event.target && event.target.classList.add('active');

  const container = document.getElementById('screens-container');
  container.innerHTML = '';

  const block = document.createElement('div');
  block.className = 'screen-block';

  const tag = document.createElement('div');
  tag.className = 'screen-tag';
  tag.textContent = `Screen ${Object.keys(screens).indexOf(screenId) + 1} of ${Object.keys(screens).length} — ${screens[screenId].label}`;
  block.appendChild(tag);

  const phone = buildPhone(screenId);
  block.appendChild(phone);
  container.appendChild(block);

  window.currentScreen = screenId;
}

function navigateTo(screenId) {
  if (screens[screenId]) {
    // Highlight correct nav button
    document.querySelectorAll('.screen-nav-btn').forEach((btn, i) => {
      btn.classList.toggle('active', Object.keys(screens)[i] === screenId);
    });
    showScreen(screenId);
  }
}

function navigateToLogin() { navigateTo('login'); }

// Initialize — show splash first
(function() {
  document.querySelectorAll('.screen-nav-btn').forEach((btn, i) => {
    const key = Object.keys(screens)[i];
    btn.addEventListener('click', function() {
      document.querySelectorAll('.screen-nav-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      showScreen(key);
    });
  });
  showScreen('splash');
})();
</script>
</body>
